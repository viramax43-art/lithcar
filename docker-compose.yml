services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
        - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:latest
    container_name: digital_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: digital_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: digital_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/driver-photos || true;
      exit 0;
      "
    restart: "no"


  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital_api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/lithcar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: driver-photos
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ping')\"",
        ]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital_bot
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/lithcar
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_POLLING_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.bot.main"]



  # OSRM — маршрутизация по дорогам (Литва)
  # Для первого запуска: скачайте lithuania-latest.osm.pbf с https://download.geofabrik.de/europe/lithuania.html
  # и поместите в ./deploy/osrm/ , затем запустите:
  #   docker compose run --rm osrm-prep
  #   docker compose up -d osrm
  osrm-prep:
    image: osrm/osrm-backend:latest
    container_name: digital_osrm_prep
    volumes:
      - ./deploy/osrm:/data
    entrypoint: >
      /bin/sh -c "
        osrm-extract -p /opt/car.lua /data/lithuania-latest.osm.pbf &&
        osrm-partition /data/lithuania-latest.osrm &&
        osrm-customize /data/lithuania-latest.osrm
      "
    profiles: ["osrm-setup"]
    restart: "no"

  osrm:
    image: osrm/osrm-backend:latest
    container_name: digital_osrm
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./deploy/osrm:/data:ro
    command: ["osrm-routed", "--algorithm", "mld", "/data/lithuania-latest.osrm"]
    profiles: ["osrm"]

  # Сервис сборки фронтенда (встроено в docker build)
  frontend-build:
    image: node:20-alpine
    container_name: digital_frontend_build
    working_dir: /app
    env_file:
      - ./frontend/.env
    # По умолчанию включён (docker compose up -d --build соберёт и запустит его)
    volumes:
      - ./frontend:/app
      # Важно для Windows/WSL: не тащим node_modules с хоста в linux-контейнер
      # иначе npm ci/установка нативных биндингов (esbuild и т.п.) может падать с EIO/unlink.
      - frontend_node_modules:/app/node_modules
      - frontend_dist:/dist
    command: >
      sh -c "
        npm cache clean --force &&
        npm ci &&
        npm run build &&
        mkdir -p /dist &&
        rm -rf /dist/* &&
        cp -a dist/. /dist/
      "
    restart: "no"

  # Публичный фронт и обратный прокси с автоматическим TLS
  caddy:
    image: caddy:2-alpine
    container_name: digital_caddy
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - frontend_dist:/srv
    depends_on:
      api:
        condition: service_started
      frontend-build:
        condition: service_completed_successfully
    logging:
      driver: "none"

volumes:
  pgdata:
  redisdata:
  minio_data:
  caddy_data:
  caddy_config:
  frontend_dist:
  frontend_node_modules:
